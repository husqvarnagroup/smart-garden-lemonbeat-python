[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lemonbeat"
version = "0.0.1"
authors = [
    { name = "Adrian Friedli", email = "adrian.friedli@husqvarnagroup.com" },
]
description = "Use Lemonbeat in Python"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "crcmod~=1.7",
    "pycryptodomex>=3.9.7,==3.*",
    "pyxdg~=0.27",
    "toml~=0.10.2",
]

[project.optional-dependencies]
test = [
    "pytest~=6.2.5",
    "pytest-cov~=4.1.0",
    "ipython~=7.29.0",
]
azure-pipelines = [
    "pytest-azurepipelines~=1.0.4",
]

[tool.setuptools]
packages = ["lemonbeat"]

[tool.setuptools.package-data]
lemonbeat = ["lib/*/liblsdl-serializer.so"]
